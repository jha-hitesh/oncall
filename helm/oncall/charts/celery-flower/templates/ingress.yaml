{{- if .Values.ingress.enabled -}}
{{- $fullName := include "celery-flower.fullname" . -}}
{{- $ingressPath := .Values.ingress.path -}}
{{- $hosts := .Values.ingress.hosts | default (list "") -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    app: {{ template "celery-flower.name" . }}
    chart: {{ template "celery-flower.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
{{- with .Values.ingress.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
{{- if .Values.ingress.tls }}
  tls:
  {{- range .Values.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
{{- end }}
  rules:
  {{- range $host := $hosts }}
    - {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $ingressPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
  {{- end }}
{{- end }}
